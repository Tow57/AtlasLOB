[build-system]
requires = [
  "scikit-build-core==1.0.3",
  "pybind11==3.0.4",
]
build-backend = "scikit_build_core.build"

[project]
name = "atlaslob"
version = "0.2.0"
description = "Deterministic AtlasLOB matching engine and independent Python correctness oracle"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Lucas" }]
dependencies = []

[project.scripts]
atlaslob-diff = "atlaslob.cli:main"

[project.optional-dependencies]
dev = [
  "hypothesis==6.160.0",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "ruff==0.15.22",
  "cibuildwheel==4.1.0",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
strict-config = true
cmake.version = ">=3.25"
cmake.build-type = "Release"
build.targets = ["atlas_native_engine"]
wheel.packages = ["python/src/atlaslob"]
wheel.exclude = ["atlaslob/performance/**"]
install.components = ["python"]
sdist.inclusion-mode = "explicit"
sdist.include = [
  "/CMakeLists.txt",
  "/cmake",
  "/include",
  "/src",
  "/benchmarks/python/atlas_python_bench_worker.py",
  "/python/src/atlaslob",
  "/LICENSE",
  "/README.md",
  "/THIRD_PARTY_NOTICES.md",
  "/pyproject.toml",
]
sdist.exclude = [
  "/build",
  "/out",
  "/.git",
  "/.github",
  "/.codex-review",
  "/python/src/*.egg-info",
  "**/__pycache__",
  "**/*.py[cod]",
]

[tool.scikit-build.cmake.define]
ATLAS_BUILD_PYTHON = true
ATLAS_BUILD_FUZZERS = false
BUILD_SHARED_LIBS = false
BUILD_TESTING = false

[tool.cibuildwheel]
build = [
  "cp311-manylinux_x86_64",
  "cp312-manylinux_x86_64",
  "cp313-manylinux_x86_64",
  "cp314-manylinux_x86_64",
]
build-frontend = "build"
test-command = "python {project}/tests/packaging/wheel_smoke.py"
environment = { CMAKE_BUILD_PARALLEL_LEVEL = "2" }

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["python/tests"]
markers = [
  "campaign: deterministic multi-seed differential campaign",
  "differential_fuzz: bounded cross-language fuzz smoke",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"python/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = [
  "python/src",
  "python/tests",
  "benchmarks/python/atlas_python_bench_worker.py",
  "tests/fuzz/run_command_log_fuzz_smoke.py",
  "tests/packaging",
]
